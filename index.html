<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Mandadito · Prototipo v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#13261C; --muted:#586A5F; --line:#DAE3DB;
  --brand:#FFC21A; --brand-ink:#2A1F00; --green:#1E6B45; --green-soft:#DDF0E4;
  --red:#C0283B; --on-red:#FFFFFF; --red-soft:#FBE3E6; --amber:#8A5A00; --amber-soft:#FFF0C7; --tile:#EAF0EA;
  --c-refrescos:#D9ECFF; --c-lacteos:#FFF6D6; --c-pastas:#FFE9C2; --c-cereales:#F6DDEB; --c-frescos:#DDF2D5;
  --shadow:0 1px 2px rgba(19,38,28,.08),0 8px 24px rgba(19,38,28,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A14; --surface:#17251D; --ink:#EAF2EC; --muted:#9DB0A5; --line:#284034;
    --green:#5CCB8D; --green-soft:#1D3A2B; --red:#FF7385; --on-red:#2B0A10; --red-soft:#3E1B22; --amber:#FFD36B; --amber-soft:#3A3010; --tile:#1F3027;
    --c-refrescos:#1B2E42; --c-lacteos:#3A3418; --c-pastas:#3A2E17; --c-cereales:#3A2230; --c-frescos:#1F3A22;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A14; --surface:#17251D; --ink:#EAF2EC; --muted:#9DB0A5; --line:#284034;
  --green:#5CCB8D; --green-soft:#1D3A2B; --red:#FF7385; --on-red:#2B0A10; --red-soft:#3E1B22; --amber:#FFD36B; --amber-soft:#3A3010; --tile:#1F3027;
  --c-refrescos:#1B2E42; --c-lacteos:#3A3418; --c-pastas:#3A2E17; --c-cereales:#3A2230; --c-frescos:#1F3A22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
s{color:var(--muted);font-weight:500}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:10px 10px 10px 3px;background:var(--brand);display:grid;place-items:center;font-size:19px}
.addr{display:flex;flex-direction:column;align-items:flex-start;border:0;background:var(--tile);border-radius:12px;padding:5px 12px;min-width:0;max-width:260px;text-align:left}
.addr small{font-size:11px;color:var(--muted);line-height:1.1}
.addr b{font-size:14px;line-height:1.25;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eta-pill{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--brand);animation:pulse 1.8s ease-in-out infinite;flex:none}
.dot.g{background:var(--green);animation-name:pulseg}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,194,26,.7)}50%{box-shadow:0 0 0 6px rgba(255,194,26,0)}}
@keyframes pulseg{0%,100%{box-shadow:0 0 0 0 rgba(30,107,69,.6)}50%{box-shadow:0 0 0 6px rgba(30,107,69,0)}}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--tile);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
body[data-mode="admin"] .addr,body[data-mode="admin"] .eta-pill,body[data-mode="courier"] .addr,body[data-mode="courier"] .eta-pill{display:none}
@media (max-width:720px){.addr{order:5;flex:1 1 100%;max-width:none}.addr b{max-width:90vw}.brand span.t{display:none}}

main{max-width:1180px;margin:0 auto;padding:16px 16px 110px}

/* ---------- store ---------- */
.live{width:100%;display:flex;align-items:center;gap:12px;border:0;text-align:left;background:var(--green-soft);color:var(--ink);border-radius:16px;padding:12px 16px;margin-bottom:14px}
.live .dot{background:var(--green);animation-name:pulseg}
.live b{display:block;font-size:15px}
.live span.s{font-size:13px;color:var(--muted)}
.live .go{margin-left:auto;font-weight:700;font-size:14px;color:var(--green)}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
textarea{resize:vertical;min-height:64px}
.tools{display:grid;gap:14px;margin-bottom:16px}
.cts{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px}
.ct{flex:none;width:84px;border:0;background:transparent;display:grid;gap:6px;justify-items:center;font-weight:600;font-size:13px;padding:0}
.ct .ic{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font-size:32px;border:3px solid transparent}
.ct.on .ic{border-color:var(--ink)}
.ct .all{background:var(--brand)}
.banner{width:100%;border:0;text-align:left;background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.banner h2{font-size:clamp(22px,4vw,32px);font-weight:800;line-height:1.05}
.banner p{margin:6px 0 0;font-weight:500;max-width:44ch}
.banner .em{font-size:44px;white-space:nowrap}
.sec{margin-bottom:24px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sh h2{font-size:22px;font-weight:800}
.lnk{border:0;background:transparent;color:var(--green);font-weight:700;padding:4px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;margin:0 -2px}
.rail .pc{flex:0 0 154px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.pc .tile{height:122px;display:grid;place-items:center;font-size:56px;position:relative}
.t-refrescos{background:var(--c-refrescos)}.t-lacteos{background:var(--c-lacteos)}.t-pastas{background:var(--c-pastas)}.t-cereales{background:var(--c-cereales)}.t-frescos{background:var(--c-frescos)}
.tags{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--amber-soft);color:var(--amber)}
.tag.promo{background:var(--red);color:var(--on-red)}
.ctl{position:absolute;right:8px;bottom:8px}
.plus{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:24px;line-height:1;box-shadow:var(--shadow)}
.st{display:flex;align-items:center;background:var(--ink);color:var(--surface);border-radius:999px;height:38px;box-shadow:var(--shadow)}
.st button{width:34px;height:38px;border:0;background:transparent;color:inherit;font-size:20px;font-weight:700}
.st button:disabled{opacity:.35}
.st span{min-width:30px;text-align:center;font-weight:700;font-size:14px;padding:0 2px}
.sold{background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.pc .pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.pc .pr{font-weight:800;font-size:17px}
.pc .pr small{font-weight:500;color:var(--muted);font-size:12px}
.pc h3{font-family:Figtree,sans-serif;font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pc.out{opacity:.7}
.empty{grid-column:1/-1;color:var(--muted);padding:32px 8px;text-align:center}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;pointer-events:none;transform:translateY(130%);transition:transform .25s ease}
.cartbar.show{transform:none}
.cartbar button{pointer-events:auto;width:min(560px,100%);border:0;background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;box-shadow:var(--shadow)}
.cartbar .cl{display:flex;align-items:center;gap:10px}
.cartbar .badge{background:var(--brand-ink);color:var(--brand);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;padding:0 7px}

/* ---------- cart drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(430px,100%);z-index:41;background:var(--surface);transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:var(--shadow)}
.drawer.open{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.drawer h2{font-size:24px}
.x{border:0;background:var(--tile);width:36px;height:36px;border-radius:50%;font-size:18px}
.dscroll{flex:1;overflow:auto;padding:6px 0}
.prog{margin:8px 0 6px}
.prog .bar{height:8px;border-radius:4px;background:var(--tile);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.prog p{margin:6px 0 0;font-size:13px;font-weight:600}
.line{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .e{font-size:30px;text-align:center}
.line b{font-weight:600;display:block;font-size:15px;line-height:1.2}
.line small{color:var(--muted)}
.mini{display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.mini button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.xs-title{font-weight:700;margin:14px 0 8px}
.xs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.xi{flex:none;width:118px;background:var(--tile);border-radius:14px;padding:8px;display:grid;gap:2px;position:relative}
.xi .e{font-size:30px}
.xi b{font-size:13px;font-weight:600;line-height:1.2;min-height:31px}
.xi .p{font-size:13px;font-weight:700}
.xi .plus{position:absolute;right:6px;top:6px;width:30px;height:30px;font-size:20px}
.sum{border-top:2px dashed var(--line);padding-top:12px;display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;margin:4px 0 10px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--tile);color:var(--ink)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* ---------- modal ---------- */
.modalwrap{position:fixed;inset:0;z-index:60;background:rgba(10,20,14,.55);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.modalwrap.open{display:flex}
.sheet{background:var(--surface);border-radius:22px;width:min(560px,100%);max-height:100%;overflow:auto;padding:22px}
.sheet h2{font-size:24px;margin-bottom:14px}
.f{display:grid;gap:12px}
.f label{display:grid;gap:5px;font-weight:600;font-size:14px}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-t{font-weight:700;font-size:14px;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;font-weight:600;font-size:14px;display:grid;gap:2px}
.opt small{font-weight:500;color:var(--muted);font-size:12px}
.opt.on{border-color:var(--green);background:var(--green-soft)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.cp{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px}
.cp.on{border-color:var(--green);background:var(--green-soft)}
.cprow{display:flex;gap:8px}
.cprow input{flex:1}
.paydetail{background:var(--tile);border-radius:12px;padding:12px;font-size:14px;color:var(--muted)}
.paydetail .f{color:var(--ink)}
.cosum{background:var(--tile);border-radius:14px;padding:12px 14px;display:grid;gap:5px;font-size:15px}
.cosum div{display:flex;justify-content:space-between}
.cosum .disc{color:var(--green);font-weight:600}
.cosum .t{font-weight:800;font-size:18px;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.dtile{height:170px;border-radius:18px;display:grid;place-items:center;font-size:86px;margin-bottom:14px;position:relative}
.dprice{font-size:24px;font-weight:800;margin:2px 0 4px}
.dq{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.dq button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:24px;font-weight:700}
.dq button:disabled{opacity:.35}
.dq span{font-size:22px;font-weight:800;min-width:90px;text-align:center}

/* mapa para marcar ubicación */
.pickmap{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:16px;cursor:crosshair;touch-action:manipulation}
.pickmsg{text-align:center;font-size:14px;font-weight:600;margin:8px 0}
.pickmsg.ok{color:var(--green)}.pickmsg.bad{color:var(--red)}

/* seguimiento cliente */
.ok-big{text-align:center;padding:4px 0 8px}
.ok-big .check{width:60px;height:60px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:30px;margin:0 auto 10px}
.trk-eta{text-align:center;margin:8px 0 4px}
.etab{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:44px;line-height:1;margin:4px 0 2px}
.pbar{height:8px;border-radius:4px;background:var(--tile);overflow:hidden;margin:10px 0}
.pbar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.cour{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:14px;padding:10px 12px;margin:10px 0;text-align:left}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.mmap{display:block;margin:10px auto 4px;border-radius:16px;overflow:hidden;width:min(260px,100%);background:var(--tile)}
.mmap-ph{margin:10px auto 4px;border:2px dashed var(--line);border-radius:16px;padding:18px 12px;text-align:center;font-size:13px;color:var(--muted);width:min(260px,100%)}
.tl{list-style:none;margin:16px 0;padding:0;text-align:left;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .d{width:28px;height:28px;border-radius:50%;background:var(--tile);color:var(--muted);display:grid;place-items:center;font-size:13px;font-weight:800}
.tl li.done .d{background:var(--green);color:#fff}
.tl li.done::before{background:var(--green)}
.tl li.cur .d{background:var(--brand);color:var(--brand-ink);animation:pulse 1.8s ease-in-out infinite}
.tl b{display:block;font-size:15px;line-height:1.3}
.tl small{color:var(--muted)}
.tl li:not(.done):not(.cur) b{color:var(--muted)}
.refbox{background:var(--tile);border-radius:12px;padding:12px;margin:10px 0;font-weight:700;letter-spacing:.04em;word-break:break-all;text-align:left}
.items{text-align:left;font-size:14px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:4px}
.items div{display:flex;justify-content:space-between;gap:10px}

/* ---------- admin ---------- */
.atabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--line)}
.atabs button{flex:none;border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.atabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ahead h2{font-size:26px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:16px}
.kpi{padding:16px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px;margin-top:2px}
.kpi.warn .v{color:var(--red)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h3{font-size:18px;margin-bottom:10px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.low{background:var(--amber-soft);color:var(--amber)}
.pill.out{background:var(--red-soft);color:var(--red)}
.pill.mut{background:var(--tile);color:var(--muted)}
td input[type=number]{width:92px;padding:6px 8px;border-radius:8px}
.rowact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.mini-list .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.mini-list .it:last-child{border-bottom:0}
.locgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.mvform{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;max-width:720px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:grid;gap:8px}
.order .oh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.pick{display:grid;gap:6px;font-size:14px;background:var(--tile);border-radius:12px;padding:10px 12px}
.pick .from{font-size:12px;color:var(--muted)}
.steps{display:flex;gap:4px}

<script>
(function(){
'use strict';
const KEY='mimandadito-proto-v4';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const round=x=>Math.round(x*1000)/1000;
const r2=x=>Math.round(x*100)/100;
const MXN=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});
const money=n=>MXN.format(n||0);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const daysTo=s=>{const a=new Date(s+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/86400000)};
const fdate=ts=>new Date(ts).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const fday=s=>new Date(s+'T00:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short'});

const CATS=[
 {id:'refrescos',name:'Refrescos',emoji:'🥤',loc:'l2',shelf:120},
 {id:'lacteos',name:'Lácteos',emoji:'🥛',loc:'l3',shelf:14},
 {id:'pastas',name:'Pastas',emoji:'🍝',loc:'l1',shelf:300},
 {id:'cereales',name:'Cereales',emoji:'🥣',loc:'l1',shelf:200},
 {id:'frescos',name:'Frutas y verduras',emoji:'🥑',loc:'l4',shelf:6}
];
const LOCS=[
 {id:'l1',name:'Bodega seca',short:'Bodega',code:'A'},
 {id:'l2',name:'Anaquel de refrescos',short:'Refrescos',code:'B'},
 {id:'l3',name:'Refrigerador de lácteos',short:'Refri',code:'C'},
 {id:'l4',name:'Cámara de frutas y verduras',short:'Cámara',code:'D'}
];
const MOTIVOS=['Caducado','Dañado o roto','Maduración excesiva','Derrame o fuga','Robo o extravío','Otro'];
const PAYS=[
 {id:'tarjeta',e:'💳',n:'Tarjeta de crédito o débito'},
 {id:'efectivo',e:'💵',n:'Efectivo al recibir'},
 {id:'spei',e:'🏦',n:'Transferencia SPEI'},
 {id:'oxxo',e:'🏪',n:'Pago en OXXO'}
];
const RIPE=[
 {id:'hoy',n:'Para hoy',d:'Madura, lista para comer'},
 {id:'normal',n:'Normal',d:'El punto de siempre'},
 {id:'dias',n:'Para varios días',d:'Firme, aguanta 3–4 días'}
];
const COUPONS={BIENVENIDO10:'10% de descuento en tu primer pedido',ENVIOGRATIS:'Envío gratis en este pedido'};
const TIPS=[0,10,20,30];
const STATUS=['Nuevo','Surtiendo','En camino','Entregado'];
const TRACK=[['Pedido recibido','Ya lo tenemos y lo pasamos a la bodega.'],['Surtiendo tu pedido','Estamos armando tus productos.'],['Va en camino','Tu repartidor se dirige a tu dirección.'],['Entregado','Buen provecho.']];
const PROMO={'Cola 2.5 L':59,'Leche entera 1 L':32,'Aguacate Hass':109,'Hojuelas de maíz 500 g':69,'Queso panela 400 g':92,'Plátano':34,'Espagueti 200 g':14};

/* reparto */
const SPEED=24;           // km/h promedio urbano en moto
const PICK_MIN=3;         // minutos para surtir un pedido
const MAXR=14;            // el mapa de despacho cubre ±14 km
const BASE={lat:20.6597,lng:-103.3496}; // punto de referencia de ejemplo para convertir km a coordenadas
const CNAMES=['Diego M.','Sofía R.','Luis H.','Ana P.','Marco T.'];
const CCOL=['#2F6FDE','#C0283B','#7B3FB8','#0F8F7E','#C75A0A'];
const VC={x:2.7,y:-1.9},VH=16; // ventana del mapa del cliente: no está centrada en la bodega
const REPL=[{id:'similar',n:'Reemplazar con uno similar',d:'Nunca pagas más que el original'},{id:'none',n:'No reemplazar',d:'Te devolvemos su importe'}];
const ISSUES=['Llegó dañado','No estaba fresco','Faltó en mi pedido','Otro'];
const CUST_MSG=['Ya voy bajando','Toca el timbre, por favor','Déjalo en recepción','Llámame al llegar'];
const COUR_MSG=['Ya llegué','Estoy afuera','No encuentro la dirección','Voy en camino'];
const PLUS_FEE=49;
const isActive=o=>o.status!=='Entregado'&&o.status!=='Cancelado';
const newPin=()=>String(1000+Math.floor(Math.random()*9000));

// nombre, cat, emoji, precio, unidad, mínimo, costo, existencia, vida útil (días)
const SEEDP=[
 ['Cola 600 ml','refrescos','🥤',19,'pza',24,12.5,96],
 ['Cola 2.5 L','refrescos','🥤',49,'pza',12,33,40],
 ['Refresco de naranja 600 ml','refrescos','🍊',18,'pza',18,11.5,54],
 ['Refresco de limón 2 L','refrescos','🍋',36,'pza',12,23,8],
 ['Agua mineral 600 ml','refrescos','🫧',17,'pza',12,10.5,36],
 ['Agua natural 1.5 L','refrescos','💧',15,'pza',20,8.5,72],
 ['Leche entera 1 L','lacteos','🥛',27,'pza',18,21,48],
 ['Leche deslactosada 1 L','lacteos','🥛',30,'pza',12,23.5,5],
 ['Yogur natural 900 g','lacteos','🍦',42,'pza',8,31,14,2],
 ['Queso panela 400 g','lacteos','🧀',79,'pza',6,58,10],
 ['Queso Oaxaca','lacteos','🧀',189,'kg',3,140,9],
 ['Crema 200 ml','lacteos','🥣',24,'pza',8,17,16],
 ['Espagueti 200 g','pastas','🍝',11,'pza',24,7,60],
 ['Codo 200 g','pastas','🍝',11,'pza',24,7,52],
 ['Fideo 200 g','pastas','🍜',9,'pza',24,5.5,70],
 ['Pluma 200 g','pastas','🍝',12,'pza',18,7.5,34],
 ['Hojuelas de maíz 500 g','cereales','🌽',58,'pza',8,41,24],
 ['Avena en hojuela 400 g','cereales','🌾',32,'pza',10,21,30],
 ['Granola con miel 350 g','cereales','🍯',69,'pza',6,49,12],
 ['Arroz inflado 300 g','cereales','🍚',49,'pza',6,34,15],
 ['Cereal de chocolate 400 g','cereales','🍫',62,'pza',8,44,20],
 ['Plátano','frescos','🍌',28,'kg',8,17,22],
 ['Manzana roja','frescos','🍎',54,'kg',8,38,18],
 ['Naranja','frescos','🍊',24,'kg',10,14,30],
 ['Limón','frescos','🍋',36,'kg',5,22,12],
 ['Aguacate Hass','frescos','🥑',89,'kg',6,62,11,4],
 ['Jitomate saladet','frescos','🍅',32,'kg',8,20,14],
 ['Cebolla blanca','frescos','🧅',29,'kg',6,18,16,10],
 ['Papa blanca','frescos','🥔',33,'kg',8,21,25,14],
 ['Zanahoria','frescos','🥕',22,'kg',6,13,15,8],
 ['Cilantro (manojo)','frescos','🌿',12,'pza',10,6,20,3]
];

let S;
const ui={mode:'store',cat:'all',q:'',cart:{},ripe:{},cartOpen:false,tab:'resumen',mv:'entrada',pre:null,pay:'tarjeta',invQ:'',d:null,coupon:null,tip:0,when:'ahora',
  speed:60,paused:false,cid:'c1',dest:null,track:null,_liveSig:'',_dSig:'',_cSig:'',repl:'similar',ofilter:'curso',pickOid:null,_tSig:'',_pSig:''};

const prod=id=>S.products.find(p=>p.id===id);
const loc=id=>LOCS.find(l=>l.id===id);
const cat=id=>CATS.find(c=>c.id===id);
const ripeOf=id=>RIPE.find(r=>r.id===id);
const cour=id=>S.couriers.find(c=>c.id===id);
const ordr=id=>S.orders.find(o=>o.id===id);
const stock=(pid,lid)=>round(S.lots.reduce((s,l)=>s+((l.pid===pid&&(!lid||l.loc===lid))?l.qty:0),0));
const fq=(p,q)=>p.unit==='kg'?(Math.round(q*100)/100)+' kg':q+' pza';
const stepOf=p=>p.unit==='kg'?0.5:1;
const hasRipe=p=>p.cat==='frescos'&&p.unit==='kg';

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const loadS=()=>{try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}};

/* ---------- ledger & inventory ---------- */
function mov(type,pid,lid,qty,note,ts,extra){
  const m={id:S.seq.mov++,ts:ts||Date.now(),type,pid,loc:lid,qty,note:note||''};
  if(extra)Object.assign(m,extra);
  S.movs.unshift(m);return m;
}
function addLot(pid,lid,qty,exp,cost){
  const ex=S.lots.find(l=>l.pid===pid&&l.loc===lid&&l.exp===exp);
  if(ex){ex.qty=round(ex.qty+qty);if(cost)ex.cost=cost;return ex}
  const l={id:'L'+(S.seq.lot++),pid,loc:lid,qty:round(qty),exp,cost};
  S.lots.push(l);return l;
}
function deduct(pid,qty,lid,fresh){
  const lots=S.lots.filter(l=>l.pid===pid&&l.qty>0&&(!lid||l.loc===lid)).sort((a,b)=>(a.exp<b.exp?-1:1)*(fresh?-1:1));
  const avail=lots.reduce((s,l)=>s+l.qty,0);
  if(avail+1e-9<qty)return null;
  let need=qty;const taken=[];
  for(const l of lots){
    if(need<=1e-9)break;
    const t=Math.min(l.qty,need);
    l.qty=round(l.qty-t);need=round(need-t);
    taken.push({loc:l.loc,qty:t,exp:l.exp,cost:l.cost});
  }
  S.lots=S.lots.filter(l=>l.qty>1e-9);
  return taken;
}
function createOrder(info,items,ts,calc){
  ts=ts||Date.now();
  const id='M-'+(S.seq.order++),lines=[];let sub=0;
  items.forEach(it=>{
    const p=prod(it.pid),taken=deduct(it.pid,it.qty,null,it.ripe==='dias');
    taken.forEach(t=>mov('venta',p.id,t.loc,t.qty,'Pedido '+id,ts));
    const from=taken.map(t=>loc(t.loc).short+' '+fq(p,t.qty));
    lines.push({pid:p.id,name:p.name,qty:it.qty,price:p.price,unit:p.unit,emoji:p.emoji,ripe:it.ripe||'',from,taken,picked:false,missing:false,sub:null});
    sub+=p.price*it.qty;
  });
  sub=r2(sub);
  const fee=calc?calc.fee:(sub>=300?0:25),disc=calc?calc.disc:0,tip=calc?calc.tip:0,credit=calc&&calc.credit?calc.credit:0;
  const o=Object.assign({id,ts,items:lines,sub,fee,disc,tip,credit,total:r2(sub-disc+fee+tip-credit),status:'Nuevo',when:'ahora',slot:'',coupon:'',
    dest:null,cid:'',ready:false,pickLeft:PICK_MIN,arrived:false,released:false,pin:newPin(),chat:[],sim:0,promise:0,rating:0,issues:[],refunds:[],refCredit:0,repl:'similar',late:false},info);
  if(!o.promise&&o.dest)o.promise=Math.ceil(quoteEta(o.dest));
  S.orders.unshift(o);return o;
}

/* ---------- reparto: geometría ---------- */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const inCover=p=>!!p&&dist(p,S.hub)<=S.radius+1e-9;
function makeRoute(d){
  const h=S.hub,xf=(Math.abs(Math.round(d.x*10+d.y*10))%2)===0;
  const mid=xf?{x:d.x,y:h.y}:{x:h.x,y:d.y};
  return {pts:[{x:h.x,y:h.y},mid,{x:d.x,y:d.y}],len:Math.abs(d.x-h.x)+Math.abs(d.y-h.y)};
}
function pointAt(pts,s){
  let rem=s;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],l=Math.abs(b.x-a.x)+Math.abs(b.y-a.y);
    if(rem<=l||i===pts.length-2){const t=l?Math.min(1,rem/l):1;return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}
    rem-=l;
  }
  return pts[pts.length-1];
}
function partial(pts,s){
  const out=[pts[0]];let rem=s;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],l=Math.abs(b.x-a.x)+Math.abs(b.y-a.y);
    if(rem>=l){out.push(b);rem-=l}else{const t=l?rem/l:1;out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});break}
  }
  return out;
}
const poly=(pts,px,py)=>pts.map(p=>px(p.x).toFixed(1)+','+py(p.y).toFixed(1)).join(' ');
function toLatLng(p){
  const lat=BASE.lat+(p.y-S.hub.y)/110.574;
  const lng=BASE.lng+(p.x-S.hub.x)/(111.32*Math.cos(lat*Math.PI/180));
  return lat.toFixed(5)+', '+lng.toFixed(5);
}

/* ---------- reparto: motor ---------- */
function setPos(c){
  if(c.route){const p=pointAt(c.route,c.s);c.x=p.x;c.y=p.y}else{c.x=S.hub.x;c.y=S.hub.y}
}
function attach(o,c){
  const r=makeRoute(o.dest);
  c.state='asignado';c.oid=o.id;c.route=r.pts;c.len=r.len;c.s=0;c.dir=1;c.x=S.hub.x;c.y=S.hub.y;
  o.cid=c.id;o.status='Surtiendo';o.pickLeft=PICK_MIN;o.ready=false;o.arrived=false;
}
function assignOrder(o){
  if(!o.dest||o.cid||o.status!=='Nuevo')return false;
  if(!inCover(o.dest))return false;
  if(o.when==='prog'&&!o.released)return false;
  const c=S.couriers.find(x=>x.state==='libre');
  if(!c)return false;
  attach(o,c);return true;
}
function depart(o){
  const c=cour(o.cid);
  if(!c||o.status!=='Surtiendo')return;
  c.state='ruta';c.dir=1;c.s=0;
  o.status='En camino';o.ready=true;o.pickLeft=0;o.departedAt=Date.now();
}
function deliver(o,pinOk){
  const c=cour(o.cid);
  o.status='Entregado';o.deliveredAt=Date.now();o.arrived=true;o.pinOk=pinOk!==false;
  if(c){
    const pay=r2(20+3*c.len+(o.tip||0));
    c.earn=r2((c.earn||0)+pay);c.trips=(c.trips||0)+1;c.lastPay=pay;o.courierPay=pay;
    c.state='regreso';c.oid='';c.dir=-1;c.s=c.len;setPos(c);
  }
  if(o.promise&&o.sim>o.promise+5){o.late=true;refund(o,30,'Compensación por retraso')}
}
function step(m){
  S.orders.filter(o=>o.status==='Nuevo').sort((a,b)=>a.ts-b.ts).forEach(assignOrder);
  S.orders.forEach(o=>{
    if(isActive(o)&&!(o.when==='prog'&&o.status==='Nuevo'&&!o.released))o.sim=(o.sim||0)+m;
    if(o.status==='Surtiendo'&&o.cid&&!o.ready){
      o.pickLeft=Math.max(0,o.pickLeft-m);
      if(o.pickLeft<=0&&S.autoPick)finishPick(o);
    }
  });
  S.couriers.forEach(c=>{
    if(c.state==='ruta'){
      c.s=Math.min(c.len,c.s+c.speed*m/60);setPos(c);
      const o=ordr(c.oid);
      if(o&&c.s>=c.len-1e-6){o.arrived=true;if(S.auto)deliver(o)}
    }else if(c.state==='regreso'){
      c.s=Math.max(0,c.s-c.speed*m/60);setPos(c);
      if(c.s<=1e-6){c.state='libre';c.route=null;c.len=0;c.s=0;c.oid='';c.x=S.hub.x;c.y=S.hub.y}
    }
  });
}
function refund(o,amt,why){
  amt=r2(amt);if(amt<=0)return;
  const cash=o.pay==='efectivo'&&isActive(o);
  if(cash)o.total=r2(Math.max(0,o.total-amt));
  else{o.refCredit=r2((o.refCredit||0)+amt);if(o.mine)S.prefs.credit=r2((S.prefs.credit||0)+amt)}
  o.refunds=(o.refunds||[]).concat({amt,why:why+(cash?' (se descuenta del cobro en efectivo)':(o.mine?' (a tu saldo)':' (a saldo del cliente)')),ts:Date.now()});
}
function freeAt(c){
  if(c.state==='libre')return 0;
  const back=c.len/c.speed*60;
  if(c.state==='regreso')return c.s/c.speed*60;
  if(c.state==='ruta')return (c.len-c.s)/c.speed*60+back;
  const o=ordr(c.oid);return (o?o.pickLeft:0)+2*back;
}
// ETA dinámico: surtido + trayecto + espera por repartidor según la cola
function quoteEta(dest){
  const r=makeRoute(dest).len/SPEED*60;
  const queue=S.orders.filter(o=>o.status==='Nuevo'&&!o.cid&&(o.when!=='prog'||o.released)).length;
  const free=S.couriers.filter(c=>c.state==='libre').length;
  let wait=0;
  if(free<=queue){const t=S.couriers.map(freeAt).sort((a,b)=>a-b);wait=t[Math.min(t.length-1,queue-free)]||0}
  return PICK_MIN+r+wait;
}
function cancelOrder(o){
  if(!(o.status==='Nuevo'||(o.status==='Surtiendo'&&!o.ready)))return false;
  o.items.forEach(L=>{
    (L.taken||[]).forEach(t=>{addLot(L.pid,t.loc,t.qty,t.exp,t.cost);mov('devolucion',L.pid,t.loc,t.qty,'Cancelación '+o.id)});
    if(L.sub&&L.sub.taken)L.sub.taken.forEach(t=>{addLot(L.sub.pid,t.loc,t.qty,t.exp,t.cost);mov('devolucion',L.sub.pid,t.loc,t.qty,'Cancelación '+o.id)});
  });
  const c=cour(o.cid);
  if(c&&c.state==='asignado'){c.state='libre';c.oid='';c.route=null;c.len=0;c.s=0;c.x=S.hub.x;c.y=S.hub.y}
  const back=(o.pay==='efectivo'?0:o.total)+(o.credit||0)-(o.refCredit||0);
  o.status='Cancelado';o.cancelledAt=Date.now();
  refund(o,back,'Pedido cancelado');
  return true;
}
function markMissing(o,i){
  const L=o.items[i];if(!L||L.missing||L.sub)return '';
  const p=prod(L.pid);
  mov('ajuste',L.pid,(L.taken&&L.taken[0]?L.taken[0].loc:'l1'),L.qty,'Faltante al surtir '+o.id);
  if(o.repl==='similar'&&p){
    const cand=S.products.filter(x=>x.cat===p.cat&&x.id!==p.id&&x.unit===p.unit&&x.active!==false&&stock(x.id)>=L.qty).sort((a,b)=>Math.abs(a.price-p.price)-Math.abs(b.price-p.price))[0];
    if(cand){
      const tk=deduct(cand.id,L.qty,null);
      tk.forEach(t=>mov('venta',cand.id,t.loc,t.qty,'Reemplazo en '+o.id));
      L.sub={pid:cand.id,name:cand.name,emoji:cand.emoji,price:cand.price,taken:tk,from:tk.map(t=>loc(t.loc).short+' '+fq(cand,t.qty))};
      L.picked=true;
      const diff=r2((L.price-cand.price)*L.qty);
      if(diff>0)refund(o,diff,'Diferencia por reemplazo de '+L.name);
      return 'Reemplazado por '+cand.name;
    }
  }
  L.missing=true;
  refund(o,L.price*L.qty,'Agotado: '+L.name);
  return 'Sin reemplazo: se devolvieron '+money(L.price*L.qty);
}
function finishPick(o){
  o.items.forEach(L=>{if(!L.missing&&!L.sub)L.picked=true});
  o.pickLeft=0;o.ready=true;
  if(S.auto)depart(o);
}

function chatHTML(o,me){

function etaMin(o){
  if(o.status==='Entregado')return 0;
  const c=cour(o.cid),r=o.dest?makeRoute(o.dest).len:0,trav=r/SPEED*60;
  if(o.status==='Nuevo')return PICK_MIN+trav+4;
  if(o.status==='Surtiendo')return o.pickLeft+trav;
  if(!c)return 0;
  return Math.max(0,(c.len-c.s)/c.speed*60);
}
function etaTxt(o){
  if(o.status==='Cancelado')return 'Cancelado';
  if(o.status==='Entregado')return 'Entregado';
  if(o.status==='En camino'&&o.arrived)return 'Llegó';
  return '~'+Math.max(1,Math.ceil(etaMin(o)))+' min';
}
function advanceOrder(o){
  if(o.status==='Nuevo'){
    o.released=true;
    if(!assignOrder(o))toast(inCover(o.dest)?'No hay repartidores libres por ahora.':'La dirección está fuera de la zona de entrega.','err');

    finishPick(o);depart(o);
  }else if(o.status==='En camino'){
    deliver(o,false);
  }
}

/* ---------- totals ---------- */
function totals(inclTip){
  let sub=0;
  Object.keys(ui.cart).forEach(id=>{const p=prod(id);if(p)sub+=p.price*ui.cart[id]});
  sub=r2(sub);
  const disc=ui.coupon==='BIENVENIDO10'?r2(sub*0.1):0;
  const fee=sub===0?0:((sub>=300||ui.coupon==='ENVIOGRATIS'||S.prefs.plus)?0:25);
  const tip=inclTip?ui.tip:0;
  const pre=r2(sub-disc+fee+tip);
  const credit=inclTip?r2(Math.min(S.prefs.credit||0,pre)):0;
  return {sub,disc,fee,tip,credit,total:r2(pre-credit)};
}
function bestSellers(){
  const cnt={};
  S.orders.forEach(o=>{if(o.status!=='Cancelado')o.items.forEach(i=>{cnt[i.pid]=(cnt[i.pid]||0)+1})});
  const list=S.products.filter(p=>p.active!==false&&cnt[p.id]).sort((a,b)=>cnt[b.id]-cnt[a.id]);
  S.products.forEach(p=>{if(list.length<8&&p.active!==false&&!list.includes(p))list.push(p)});
  return list.slice(0,8);
}
const inStockFirst=(a,b)=>(stock(b.id)>0)-(stock(a.id)>0);

const vx=x=>(x-(VC.x-VH))/(2*VH)*300;
const vy=y=>((VC.y+VH)-y)/(2*VH)*300;
function pickerHTML(){
  return '<div><div class="sec-t">Marca tu ubicación en el mapa</div><svg id="pickMap" class="pickmap" viewBox="0 0 300 300" role="img" aria-label="Mapa para marcar tu ubicación"></svg><div class="pickmsg" id="pickMsg"></div>'+

}
function drawPick(){
  const m=$('#pickMap');if(!m)return;

  const x0=Math.ceil((VC.x-VH)/2)*2,y0=Math.ceil((VC.y-VH)/2)*2;
  for(let k=x0;k<=VC.x+VH;k+=2)g+='<line x1="'+vx(k).toFixed(1)+'" y1="0" x2="'+vx(k).toFixed(1)+'" y2="300" style="stroke:var(--line)" stroke-width="'+(k%6===0?2.4:0.8)+'"/>';
  for(let k=y0;k<=VC.y+VH;k+=2)g+='<line x1="0" y1="'+vy(k).toFixed(1)+'" x2="300" y2="'+vy(k).toFixed(1)+'" style="stroke:var(--line)" stroke-width="'+(k%6===0?2.4:0.8)+'"/>';
  if(ui.dest){
    g+='<g transform="translate('+vx(ui.dest.x).toFixed(1)+','+vy(ui.dest.y).toFixed(1)+')"><circle r="13" fill="#C0283B" stroke="#fff" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="14">🏠</text></g>';
  }
  m.innerHTML=g;
  const msg=$('#pickMsg');
  if(msg){
    if(!ui.dest){msg.className='pickmsg';msg.textContent='Toca el mapa para marcar dónde te entregamos.'}
    else if(inCover(ui.dest)){msg.className='pickmsg ok';msg.textContent='Entregamos en tu zona. Llega en unos '+Math.ceil(quoteEta(ui.dest))+' min.'}
    else{msg.className='pickmsg bad';msg.textContent='Esta ubicación está fuera de nuestra zona de entrega.'}
  }
}

function pickAt(e,svg){

  setDest({x:r2((VC.x-VH)+x*2*VH),y:r2((VC.y+VH)-y*2*VH)});

function placeOrder(){
  const v=id=>{const e=$('#'+id);return e?e.value.trim():''};
  const name=v('fName'),phone=v('fPhone').replace(/\D/g,''),addr=v('fAddr');
  if(!name||phone.length<10||!addr){toast('Completa tu nombre, un teléfono de 10 dígitos y la dirección.','err');return}
  if(!ui.dest){toast('Marca tu ubicación en el mapa para calcular tu entrega.','err');return}
  if(!inCover(ui.dest)){toast('Tu ubicación está fuera de nuestra zona de entrega.','err');return}
  const items=Object.keys(ui.cart).map(pid=>({pid,qty:ui.cart[pid],ripe:ui.ripe[pid]||''}));
  for(const it of items){
    if(stock(it.pid)+1e-9<it.qty){toast('Ya no hay suficiente '+prod(it.pid).name+'. Ajusta tu mandado.','err');closeModal();ui.cartOpen=true;refreshCart();return}
  }
  const t=totals(true);
  const when=ui.when,slot=when==='prog'?v('fSlot'):'';
  let refLabel='',refVal='';
  if(ui.pay==='oxxo'){let r='';for(let k=0;k<14;k++)r+=Math.floor(Math.random()*10);refLabel='Referencia OXXO (ejemplo)';refVal=r.replace(/(.{4})/g,'$1 ')}
  if(ui.pay==='spei'){let c='646';for(let k=0;k<15;k++)c+=Math.floor(Math.random()*10);refLabel='CLABE (ejemplo)';refVal=c}
  const promise=Math.ceil(quoteEta(ui.dest));
  const o=createOrder({name,phone,addr,ref:v('fRef'),notes:v('fNotes'),pay:ui.pay,mine:true,when,slot,coupon:ui.coupon||'',refLabel,refVal,dest:{x:ui.dest.x,y:ui.dest.y},repl:ui.repl,promise},items,Date.now(),{disc:t.disc,fee:t.fee,tip:t.tip,credit:t.credit});
  S.prefs.credit=r2((S.prefs.credit||0)-t.credit);
  assignOrder(o);
  Object.assign(S.prefs,{addr,name,phone,dest:ui.dest});
  ui.cart={};ui.ripe={};ui.coupon=null;ui.tip=0;ui.when='ahora';
  save();updateAddr();renderDrawer();renderBar();renderStore();updateEta();
  ui.track=o.id;
  openModal(trackHTML(o,true));
}

/* ---------- seguimiento del cliente (sin revelar la bodega) ---------- */
function miniMap(o,c){
  const R=2.2,k=110/R,W=220;
  const dx=c.x-o.dest.x,dy=c.y-o.dest.y;
  if(Math.abs(dx)>R||Math.abs(dy)>R){
    return '<div class="mmap-ph">Tu repartidor aparecerá en el mapa cuando esté cerca. Por seguridad no mostramos de dónde sale.</div>';
  }
  let g='<rect width="220" height="220" style="fill:var(--tile)"/>';
  for(let i=-4;i<=4;i++){
    const p=110+i*0.5*k;
    g+='<line x1="'+p+'" y1="0" x2="'+p+'" y2="220" style="stroke:var(--line)" stroke-width="'+(i%2===0?2:0.8)+'"/><line x1="0" y1="'+p+'" x2="220" y2="'+p+'" style="stroke:var(--line)" stroke-width="'+(i%2===0?2:0.8)+'"/>';
  }
  g+='<g transform="translate(110,110)"><circle r="14" fill="#C0283B" stroke="#fff" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="15">🏠</text></g>';
  g+='<g transform="translate('+(110+dx*k).toFixed(1)+','+(110-dy*k).toFixed(1)+')"><circle r="15" fill="'+c.color+'" stroke="#fff" stroke-width="2.5"/><text y="6" text-anchor="middle" font-size="16">🛵</text></g>';
  return '<svg class="mmap" viewBox="0 0 220 220" role="img" aria-label="Tu repartidor cerca de tu casa">'+g+'</svg>';
}
function trkTop(o){
  if(o.status==='Cancelado')return '<div class="trk-eta"><div class="note">Pedido</div><div class="etab">Cancelado</div><div class="note">Los productos regresaron al inventario.</div></div>';
  const c=cour(o.cid),first=c?c.name.split(' ')[0]:'';
  const m=Math.max(1,Math.ceil(etaMin(o)));
  let lbl='Llega en',big,sub,pct=0,card='',map='';
  if(o.status==='Entregado'){lbl='Pedido';big='Entregado';sub='Buen provecho.';pct=100}
  else if(o.when==='prog'&&o.status==='Nuevo'&&!o.released){lbl='Entrega programada';big=esc(o.slot);sub='Lo mandamos a surtir unos 20 minutos antes.'}
  else if(o.status==='Nuevo'){big='~'+m+' min';sub='Estamos asignando a tu repartidor.';pct=3}
  else if(o.status==='Surtiendo'){big='~'+m+' min';sub=esc(first)+' está esperando tu pedido en la bodega.';pct=Math.round((PICK_MIN-o.pickLeft)/PICK_MIN*15)}
  else if(o.arrived){big='Llegó';sub=esc(first)+' está en tu puerta.';pct=100;if(c)map=miniMap(o,c)}
  else{big='~'+m+' min';sub=esc(first)+' va hacia ti. Está a '+(c.len-c.s).toFixed(1)+' km.';pct=Math.round(15+85*(c.s/(c.len||1)));if(c)map=miniMap(o,c)}
  if(c&&o.status!=='Nuevo'&&isActive(o))card='<div class="cour"><span class="av" style="background:'+c.color+'">'+esc(c.name[0])+'</span><div><b>'+esc(c.name)+'</b><div class="note">Moto eléctrica de Mi Mandadito</div></div></div>';
  return '<div class="trk-eta"><div class="note">'+lbl+'</div><div class="etab num">'+big+'</div><div class="note">'+sub+'</div></div><div class="pbar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>'+card+map;
}
function trkTl(o){
  if(o.status==='Cancelado')return '';
  const idx=STATUS.indexOf(o.status);
  return TRACK.map((s,i)=>'<li class="'+(i<idx||idx===3?'done':(i===idx?'cur':''))+'"><span class="d">'+((i<idx||idx===3)?'✓':(i+1))+'</span><div><b>'+(i===2&&idx===2&&o.arrived?'Tu repartidor llegó':s[0])+'</b>'+(i===idx&&idx<3?'<small>'+s[1]+'</small>':'')+'</div></li>').join('');
}
function trkSig(o){return o.status+'|'+(o.chat||[]).length+'|'+o.rating+'|'+(o.issues||[]).length+'|'+(o.refunds||[]).length+'|'+(o.arrived?1:0)+'|'+(o.ready?1:0)}

  return h;

function submitMov(){
  const pid=$('#mvProd').value,p=prod(pid),lid=$('#mvLoc').value,qty=round(parseFloat($('#mvQty').value));
  if(!(qty>0)){toast('Escribe una cantidad mayor a cero.','err');return}
  if(ui.mv==='entrada'){
    const exp=$('#mvExp').value,cost=parseFloat($('#mvCost').value)||p.cost;
    if(!exp){toast('Indica la fecha de caducidad del lote.','err');return}
    addLot(pid,lid,qty,exp,cost);p.cost=cost;
    mov('entrada',pid,lid,qty,$('#mvNote').value.trim()||'Entrada de mercancía');
    toast('Entrada guardada: '+fq(p,qty)+' de '+p.name);
  }else if(ui.mv==='merma'){
    const taken=deduct(pid,qty,lid);
    if(!taken){toast('Solo hay '+fq(p,stock(pid,lid))+' en esa ubicación.','err');return}
    mov('merma',pid,lid,qty,$('#mvMot').value,null,{value:qty*p.cost});
    toast('Merma registrada: '+fq(p,qty)+' de '+p.name);
  }else{
    const to=$('#mvTo').value;
    if(to===lid){toast('Elige una ubicación de destino distinta.','err');return}
    const tk=deduct(pid,qty,lid);
    if(!tk){toast('Solo hay '+fq(p,stock(pid,lid))+' en esa ubicación.','err');return}
    tk.forEach(t=>addLot(pid,to,t.qty,t.exp,t.cost));
    mov('traspaso',pid,lid,qty,'Traspaso entre ubicaciones',null,{to});
    toast('Traspaso guardado');
  }
  save();renderAdmin();
}

function adminPick(){
  const list=S.orders.filter(o=>o.status==='Surtiendo'&&!o.ready).sort((a,b)=>a.ts-b.ts);
  if(ui.pickOid&&!list.find(o=>o.id===ui.pickOid))ui.pickOid=null;
  if(!ui.pickOid&&list[0])ui.pickOid=list[0].id;
  const head='<div class="ahead"><h2>Surtido</h2><label class="chk"><input type="checkbox" id="autoPick" '+(S.autoPick?'checked':'')+'> Surtido automático</label></div>'+
    '<p class="note" style="margin:-6px 0 14px;max-width:70ch">'+(S.autoPick?'El sistema surte solo al cumplirse el tiempo objetivo de '+PICK_MIN+' min. Apágalo para surtir a mano como lo haría el personal de la bodega.':'Recorre la bodega en orden A, B, C y D. Si algo falta, se aplica lo que eligió el cliente: reemplazo similar o devolución.')+'</p>';
  if(!list.length)return head+'<p class="note">No hay pedidos por surtir. Cuando entre uno aparecerá aquí.</p>';

  const tabs='<div class="chiprow" style="margin-bottom:12px">'+list.map(x=>'<button class="cp sm '+(x.id===ui.pickOid?'on':'')+'" data-act="pickSel" data-id="'+x.id+'">'+x.id+'</button>').join('')+'</div>';
  const rows=o.items.map((L,i)=>({L,i,code:L.taken&&L.taken[0]?loc(L.taken[0].loc).code:'Z'})).sort((a,b)=>a.code<b.code?-1:(a.code>b.code?1:0)).map(({L,i,code})=>{
    const st=L.missing?pill('out','Agotado: se devolvió'):(L.sub?pill('low','Reemplazo: '+esc(L.sub.name)):(L.picked?pill('ok','Tomado'):''));

function dMapSVG(){
  const W=560,k=W/28,px=x=>(x+14)*k,py=y=>(14-y)*k,h=S.hub;
  let g='<rect width="560" height="560" rx="16" style="fill:var(--tile)"/>';
  for(let i=-14;i<=14;i+=2){
    g+='<line x1="'+px(i)+'" y1="0" x2="'+px(i)+'" y2="560" style="stroke:var(--line)" stroke-width="'+(i%4===0?2.2:0.8)+'"/><line x1="0" y1="'+py(i)+'" x2="560" y2="'+py(i)+'" style="stroke:var(--line)" stroke-width="'+(i%4===0?2.2:0.8)+'"/>';
  }
  g+='<circle cx="'+px(h.x)+'" cy="'+py(h.y)+'" r="'+(S.radius*k)+'" fill="rgba(255,194,26,.14)" stroke="#E0A800" stroke-width="2" stroke-dasharray="7 6"/>';
  g+='<text x="'+(px(h.x)+6)+'" y="'+(py(h.y)-S.radius*k-6)+'" font-size="12" font-weight="700" style="fill:var(--muted)">'+S.radius+' km</text>';
  S.couriers.forEach(c=>{
    if(c.route&&c.state!=='libre'){
      g+='<polyline points="'+poly(c.route,px,py)+'" fill="none" stroke="'+c.color+'" stroke-width="2" stroke-dasharray="5 5" opacity=".5"/>';
      if(c.s>0)g+='<polyline points="'+poly(partial(c.route,c.s),px,py)+'" fill="none" stroke="'+c.color+'" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>';
    }
  });
  S.orders.filter(o=>o.dest&&isActive(o)).forEach(o=>{
    g+='<g transform="translate('+px(o.dest.x).toFixed(1)+','+py(o.dest.y).toFixed(1)+')"><circle r="9" fill="'+(STCOL[o.status]||'#D98E00')+'" stroke="#fff" stroke-width="2"/><text y="3.5" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">'+esc(o.id.slice(2))+'</text></g>';
  });
  g+='<g transform="translate('+px(h.x)+','+py(h.y)+')"><circle r="15" style="fill:var(--ink)" stroke="#fff" stroke-width="2"/><text y="5.5" text-anchor="middle" font-size="15">🏬</text></g>';
  S.couriers.filter(c=>c.state!=='libre'&&c.state!=='asignado').forEach(c=>{
    g+='<g transform="translate('+px(c.x).toFixed(1)+','+py(c.y).toFixed(1)+')"><circle r="11" fill="'+c.color+'" stroke="#fff" stroke-width="2.5"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">'+esc(c.name[0])+'</text></g>';
  });
  return '<svg viewBox="0 0 560 560" role="img" aria-label="Mapa de reparto con zona de cobertura, pedidos y repartidores" style="width:100%;height:auto;display:block">'+g+'</svg>';
}
function dSig(){

/* ---------- app del repartidor ---------- */
function routeMapSVG(c){
  if(!c.route)return '';
  const pts=c.route,W=300,H=200;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const minx=Math.min(...xs)-1,maxx=Math.max(...xs)+1,miny=Math.min(...ys)-1,maxy=Math.max(...ys)+1;
  const w=maxx-minx,h=maxy-miny,sc=Math.min(W/w,H/h),ox=(W-w*sc)/2,oy=(H-h*sc)/2;
  const px=x=>(x-minx)*sc+ox,py=y=>(maxy-y)*sc+oy;
  let g='<rect width="300" height="200" style="fill:var(--tile)"/>';
  g+='<polyline points="'+poly(pts,px,py)+'" fill="none" stroke="'+c.color+'" stroke-width="2.5" stroke-dasharray="5 5" opacity=".5"/>';
  if(c.s>0)g+='<polyline points="'+poly(partial(pts,c.s),px,py)+'" fill="none" stroke="'+c.color+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
  const a=pts[0],b=pts[pts.length-1];
  g+='<g transform="translate('+px(a.x).toFixed(1)+','+py(a.y).toFixed(1)+')"><circle r="12" style="fill:var(--ink)"/><text y="5" text-anchor="middle" font-size="13">🏬</text></g>';
  g+='<g transform="translate('+px(b.x).toFixed(1)+','+py(b.y).toFixed(1)+')"><circle r="12" fill="#C0283B"/><text y="5" text-anchor="middle" font-size="13">🏠</text></g>';
  g+='<g transform="translate('+px(c.x).toFixed(1)+','+py(c.y).toFixed(1)+')"><circle r="12" fill="'+c.color+'" stroke="#fff" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="13">🛵</text></g>';
  return '<svg class="cmap" viewBox="0 0 300 200" role="img" aria-label="Ruta del pedido">'+g+'</svg>';
}
function orderBlock(o){
  return '<div class="ocard"><div class="oh"><b>'+o.id+'</b>'+(o.pay==='efectivo'?pill('low','Cobrar '+money(o.total)):pill('ok','Ya pagado'))+'</div><div>'+esc(o.name)+'</div><div class="note">'+esc(o.addr)+(o.ref?', '+esc(o.ref):'')+'</div>'+(o.notes?'<div class="note">Nota: '+esc(o.notes)+'</div>':'')+'<div class="note">'+o.items.length+' productos: '+o.items.map(i=>esc(i.name)).join(', ')+'</div></div>';

}
function courierHTML(c,o){
  const first=c.name.split(' ')[0],st=STL[c.state];
  const head='<div class="ph-h"><div><small class="note">Hola,</small><div style="font-family:\'Bricolage Grotesque\',sans-serif;font-weight:800;font-size:24px">'+esc(first)+'</div></div>'+pill(st[0],st[1])+'</div><div class="gps"><i class="dot g"></i>Compartiendo tu ubicación en vivo</div><div class="earn"><span>Hoy</span><b class="num">'+money(c.earn||0)+'</b><span>'+(c.trips||0)+' entregas</span></div>';
  if(c.state==='libre'){
    const wait=S.orders.filter(x=>x.status==='Nuevo'&&!x.cid&&inCover(x.dest)&&(x.when!=='prog'||x.released)).length;
    return head+'<p style="margin:24px 0 8px"><b>Sin pedidos por ahora.</b></p><p class="note">En cuanto llegue un pedido a tu zona, la app te lo asigna. Pedidos en espera: '+wait+'.</p>';
  }
  if(c.state==='regreso'){
    return head+'<p style="margin:20px 0 4px"><b>Pedido entregado.</b> Regresa a la bodega.'+(c.lastPay?' Ganaste '+money(c.lastPay)+' por esta entrega.':'')+'</p><div class="stat3"><div><b id="cBack">—</b><span>a la bodega</span></div><div><b id="cSpd">—</b><span>velocidad</span></div><div><b>GPS</b><span>activo</span></div></div>'+routeMapSVG(c).replace('class="cmap"','class="cmap" id="cMap"');
  }
  if(!o)return head;
  if(c.state==='asignado'){
    const btn=(!S.auto&&o.ready)?'<button class="btn primary big" data-act="cDepart" data-id="'+o.id+'">Salir a entregar</button>':'<div class="note" style="text-align:center">'+(S.auto?'Saldrás automáticamente en cuanto esté listo.':'Espera a que terminen de surtir.')+'</div>';
    return head+orderBlock(o)+'<p style="margin:8px 0"><b>Surtiendo en bodega.</b> <span class="note">Listo en <span id="cPick">—</span></span></p>'+btn;
  }
  return head+orderBlock(o)+'<div class="stat3"><div><b id="cEta">—</b><span>llegada</span></div><div><b id="cDist">—</b><span>al cliente</span></div><div><b id="cSpd">—</b><span>velocidad</span></div></div><div id="cMap"></div>'+
    '<div class="chat"><div class="sec-t">Mensajes con '+esc(o.name.split(' ')[0])+'</div>'+chatHTML(o,'repartidor')+'<div class="chiprow">'+COUR_MSG.map((m,i)=>'<button class="cp sm" data-act="cmsg" data-id="'+o.id+'" data-v="'+i+'">'+m+'</button>').join('')+'</div></div>'+
    (S.auto?'<p class="note" style="text-align:center">Modo automático: la entrega se confirma sola al llegar.</p>':
    '<label class="pinin">Código de entrega del cliente<input type="text" id="pinIn" inputmode="numeric" maxlength="4" placeholder="····" autocomplete="off"></label><button class="btn primary big" id="cDel" data-act="cDeliver" data-id="'+o.id+'" disabled>Confirmar entrega</button><p class="note" style="text-align:center;margin-top:6px" id="cHint"></p>');
}

function renderCourierLive(){
  const el=$('#cLive');if(!el)return;
  const c=cour(ui.cid);if(!c)return;
  const o=ordr(c.oid);
  const sig=c.state+'|'+c.oid+'|'+(o?o.status+o.ready+o.arrived+(o.chat||[]).length:'')+'|'+S.auto;

    set('cDist',(c.len-c.s).toFixed(1)+' km');set('cSpd',c.speed+' km/h');
    const mp=$('#cMap');if(mp)mp.innerHTML=routeMapSVG(c);
    const d=$('#cDel');if(d)d.disabled=!o.arrived;

  }

  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  switch(a){
    case 'mode':ui.mode=v;render();window.scrollTo(0,0);break;
    case 'cat':ui.cat=v;ui.q='';renderStore();window.scrollTo(0,0);break;
    case 'inc':{const p=prod(id);setCart(id,(ui.cart[id]||0)+stepOf(p));break}
    case 'dec':{const p=prod(id);setCart(id,(ui.cart[id]||0)-stepOf(p));break}
    case 'detail':openDetail(id);break;
    case 'dq':{const d=ui.d,p=prod(d.pid),inC=ui.cart[d.pid]>0;d.qty=round(Math.max(inC?0:stepOf(p),Math.min(stock(p.id),d.qty+Number(v)*stepOf(p))));renderDetail();break}
    case 'ripe':ui.d.ripe=v;renderDetail();break;
    case 'dsave':{const d=ui.d,p=prod(d.pid);setCart(d.pid,d.qty);if(d.qty>0&&hasRipe(p))ui.ripe[d.pid]=d.ripe;closeModal();refreshCart(d.pid);if(d.qty>0)toast('Agregado a tu mandado');break}
    case 'openCart':ui.cartOpen=true;renderDrawer();renderBar();break;
    case 'closeCart':ui.cartOpen=false;renderDrawer();renderBar();break;
    case 'checkout':openCheckout();break;
    case 'when':ui.when=v;document.querySelectorAll('[data-act="when"]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));$('#slotBox').style.display=v==='prog'?'block':'none';break;
    case 'tip':ui.tip=Number(v);document.querySelectorAll('#tipRow .cp').forEach(x=>x.classList.toggle('on',Number(x.dataset.v)===ui.tip));refreshCo();break;
    case 'coupon':{const c=($('#fCoupon').value||'').trim().toUpperCase();if(!c){ui.coupon=null;refreshCo();toast('Cupón quitado');break}if(COUPONS[c]){ui.coupon=c;refreshCo();toast('Cupón aplicado: '+COUPONS[c])}else{toast('Ese cupón no existe. Prueba BIENVENIDO10 o ENVIOGRATIS.','err')}break}
    case 'pay':ui.pay=v;document.querySelectorAll('#payOpts .opt').forEach(x=>x.classList.toggle('on',x.dataset.v===v));$('#payDetail').innerHTML=payDetail();break;
    case 'preset':{const dm={near:2.5,mid:6,far:9.3,out:13}[v],ang=Math.random()*Math.PI*2;setDest({x:r2(S.hub.x+Math.cos(ang)*dm),y:r2(S.hub.y+Math.sin(ang)*dm)});break}
    case 'place':placeOrder();break;
    case 'track':{const o=ordr(id);if(o){ui.track=o.id;openModal(trackHTML(o,false))}break}
    case 'addr':openAddr();break;
    case 'saveAddr':{const x=($('#aIn').value||'').trim();if(!x){toast('Escribe una dirección.','err');break}S.prefs.addr=x;S.prefs.dest=ui.dest;save();updateAddr();closeModal();toast(ui.dest&&!inCover(ui.dest)?'Guardada, pero está fuera de nuestra zona de entrega.':'Dirección guardada',ui.dest&&!inCover(ui.dest)?'err':'');break}
    case 'closeModal':closeModal();break;
    case 'tab':ui.tab=v;renderAdmin();break;
    case 'goMov':ui.tab='movimientos';ui.mv=v;ui.pre=id;renderAdmin();window.scrollTo(0,0);break;
    case 'mvType':ui.mv=v;renderAdmin();break;
    case 'mvSubmit':submitMov();break;
    case 'advance':{const o=ordr(id);advanceOrder(o);save();updateEta();renderAdmin();break}
    case 'speed':ui.speed=Number(v);renderAdmin();break;
    case 'pause':ui.paused=!ui.paused;renderAdmin();break;
    case 'testOrder':testOrder();break;
    case 'release':{const o=ordr(id);o.released=true;assignOrder(o);save();ui._dSig='';renderDispatchLive();break}
    case 'assignOpen':assignModal(id);break;
    case 'assignTo':{
      const o=ordr(id),c=cour(b.dataset.c);
      if(o.status==='Nuevo'&&!o.cid){o.released=true;attach(o,c)}
      else if(o.status==='Surtiendo'&&!o.ready){const old=cour(o.cid);if(old){old.state='libre';old.oid='';old.route=null;old.len=0;old.s=0}attach(o,c)}
      save();closeModal();ui._dSig='';renderDispatchLive();toast('Pedido '+o.id+' asignado a '+c.name);break}
    case 'cDepart':{const o=ordr(id);depart(o);save();renderCourierLive();break}
    case 'cDeliver':{const o=ordr(id),pin=($('#pinIn')?$('#pinIn').value:'').trim();if(pin!==o.pin){toast('Código incorrecto. Pídeselo al cliente.','err');break}const c=cour(o.cid);deliver(o,true);save();renderCourierLive();toast('Entrega confirmada. Ganaste '+money(c?c.lastPay:0));break}
    case 'cmsg':{const o=ordr(id);sendMsg(o,'repartidor',COUR_MSG[Number(v)]);save();renderCourierLive();break}
    case 'msg':{const o=ordr(id);sendMsg(o,'cliente',CUST_MSG[Number(v)]);save();updateTrack();break}
    case 'repl':ui.repl=v;document.querySelectorAll('#replOpts .opt').forEach(x=>x.classList.toggle('on',x.dataset.v===v));break;
    case 'plusOn':S.prefs.plus=true;save();renderDrawer();toast('Activaste Mandadito Plus: tu envío es gratis.');break;
    case 'cancel':{const o=ordr(id),before=S.prefs.credit||0;if(cancelOrder(o)){save();const got=r2((S.prefs.credit||0)-before);toast('Pedido cancelado. '+(got>0?'Te devolvimos '+money(got)+' a tu saldo.':'No se te cobró nada.'));if(ui.mode==='store')renderStore();updateEta();updateTrack()}else toast('Ya salió de la bodega; ya no se puede cancelar.','err');break}
    case 'admCancel':{const o=ordr(id);if(cancelOrder(o)){save();toast('Pedido '+o.id+' cancelado y devuelto al inventario.')}else toast('Ya salió de la bodega.','err');renderAdmin();break}
    case 'rate':{const o=ordr(id);o.rating=Number(v);save();updateTrack();break}
    case 'issue':openIssue(ordr(id));break;
    case 'issueSend':{
      const o=ordr(id),ks=[...document.querySelectorAll('#issueForm input[type=checkbox]:checked')].map(x=>Number(x.value));
      if(!ks.length){toast('Elige al menos un producto.','err');break}
      const why=$('#issueWhy').value,amt=r2(ks.reduce((s,k)=>{const i=o.items[k];return s+(i.sub?i.sub.price:i.price)*i.qty},0));
      refund(o,amt,'Garantía de frescura: '+why);
      o.issues=(o.issues||[]).concat({items:ks.map(k=>o.items[k].name),reason:why,amt,ts:Date.now()});
      save();ui.track=o.id;openModal(trackHTML(o,false));toast('Te abonamos '+money(amt)+' a tu saldo.');break}
    case 'ofilter':ui.ofilter=v;renderAdmin();break;
    case 'pickSel':ui.pickOid=id;renderAdmin();break;
    case 'pickItem':{const o=ordr(id);o.items[Number(v)].picked=true;save();renderAdmin();break}
    case 'pickMiss':{const o=ordr(id),r=markMissing(o,Number(v));save();toast(r);renderAdmin();break}
    case 'pickDone':{const o=ordr(id);finishPick(o);save();toast('Pedido '+o.id+' listo. '+(S.auto?'El repartidor ya salió.':'Avísale al repartidor.'));renderAdmin();break}
    case 'newProd':newProdModal();break;
    case 'saveProd':{
      const name=$('#npName').value.trim(),price=parseFloat($('#npPrice').value);
      if(!name||!(price>0)){toast('Escribe el nombre y un precio mayor a cero.','err');break}
      S.products.push({id:'p'+(S.seq.prod++),name,cat:$('#npCat').value,emoji:$('#npEmoji').value||'🛒',price,old:0,unit:$('#npUnit').value,min:parseFloat($('#npMin').value)||0,cost:parseFloat($('#npCost').value)||0,active:true});
      save();closeModal();ui.invQ='';renderAdmin();toast('Producto creado: '+name);break}
    case 'reset':if(confirm('Se borrarán tus cambios y volverán los datos de ejemplo. ¿Continuar?')){ui.cart={};ui.ripe={};ui.track=null;seed();render();toast('Datos restablecidos')}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  const pid=t.dataset&&t.dataset.price;
  if(pid){const p=prod(pid),n=parseFloat(t.value);if(n>=0){p.price=n;if(p.old&&n>=p.old)p.old=0;save();toast('Precio actualizado: '+p.name+' ahora cuesta '+money(n))}}
  if(t.id==='cSel'){ui.cid=t.value;ui._cSig='';renderCourierLive()}
  if(t.id==='autoPick'){S.autoPick=t.checked;save();renderAdmin();toast(S.autoPick?'Surtido automático activado.':'Ahora surtes a mano desde esta pestaña.')}
  if(t.id==='autoChk'){S.auto=t.checked;save();toast(S.auto?'Los repartidores salen y entregan solos.':'Ahora operas los botones desde la vista Repartidor.')}
  if(t.id==='radIn'){const r=Math.max(1,Math.min(MAXR,parseFloat(t.value)||10));S.radius=r;t.value=r;save();toast('Radio de cobertura: '+r+' km')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();if(ui.cartOpen){ui.cartOpen=false;renderDrawer();renderBar()}}
  if(e.key==='Enter'&&document.activeElement&&document.activeElement.classList.contains('pc'))openDetail(document.activeElement.dataset.id);
});

S=loadS();
if(!S||!S.products||!S.couriers)seed();
if(!S.prefs)S.prefs={addr:'',name:'',phone:'',dest:null,credit:0,plus:false};
render();

/* reloj de la simulación */
let lastT=performance.now(),acc=0;
setInterval(()=>{
  const now=performance.now(),dt=Math.min(2,(now-lastT)/1000);lastT=now;
  if(!ui.paused)step(dt*ui.speed/60);
  uiTick();
  acc+=dt;if(acc>3){acc=0;save()}
},200);
})();
</script>
</body>
</html>
